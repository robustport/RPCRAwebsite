<script>
document.addEventListener("DOMContentLoaded", function () {
  const hero = document.querySelector(".hero-outer");
  const columns = document.querySelector("#quarto-content.page-columns, .page-columns");
  if (hero && columns && hero.parentElement !== columns) {
    columns.insertBefore(hero, columns.firstChild);
    document.body.classList.add("home-hero-page");
  }

  const sidebar = document.querySelector("#quarto-margin-sidebar");

  // Auto-enable the styled/sticky margin TOC on any page that actually has
  // one, instead of relying on a class that nothing was adding.
  if (sidebar && sidebar.querySelector("#TOC")) {
    document.body.classList.add("margin-toc-page");
  }

  if (!document.querySelector(".margin-toc-page, .hero-outer")) return;

  function alignMarginToc() {
    if (!sidebar) return;
    if (window.innerWidth <= 991) {
      sidebar.style.marginTop = "";
      return;
    }
    // Only nudge the TOC down to meet a specific anchor on hero pages,
    // where it needs to skip past the banner. On regular article/vignette
    // pages, leave it alone so it stays at the CSS sticky `top` offset,
    // near the top of the viewport.
    if (!hero) {
      sidebar.style.marginTop = "";
      return;
    }
    const anchor =
      document.querySelector("#about-the-book") ||
      document.querySelector("#overview") ||
      document.querySelector("#quarto-document-content h2, #quarto-document-content h3");
    if (!anchor) return;
    const offset =
      anchor.getBoundingClientRect().top - sidebar.getBoundingClientRect().top;
    sidebar.style.marginTop = Math.max(0, Math.round(offset)) + "px";
  }

  alignMarginToc();
  window.addEventListener("resize", alignMarginToc);
  window.addEventListener("load", function () {
    alignMarginToc();
    requestAnimationFrame(alignMarginToc);
  });

  const toc = document.querySelector("#quarto-margin-sidebar #TOC, #TOC");
  if (!toc) return;

  const links = [...toc.querySelectorAll('a[href^="#"]')];
  const sections = links
    .map(function (link) { return document.querySelector(link.getAttribute("href")); })
    .filter(Boolean);
  if (!sections.length) return;

  const setActive = function (id) {
    links.forEach(function (link) {
      link.classList.toggle("active", link.getAttribute("href") === "#" + id);
    });
  };

  const observer = new IntersectionObserver(
    function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) setActive(entry.target.id);
      });
    },
    { rootMargin: "-15% 0px -65% 0px", threshold: 0 }
  );

  sections.forEach(function (section) { observer.observe(section); });
  if (sections[0]) setActive(sections[0].id);
});
</script>
